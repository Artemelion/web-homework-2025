<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap — навигационное меню</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand span {
            color: #ffc107;
        }

        .hero {
            min-height: calc(100vh - 56px);
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #1f2937, #3b4f7a);
            color: #fff;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Weather<span>Forecast</span></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                aria-controls="mainMenu" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Прогноз</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Города</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Киев</a></li>
                            <li><a class="dropdown-item" href="#">Одесса</a></li>
                            <li><a class="dropdown-item" href="#">Львов</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#">Все города</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">Карта</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Контакты</a></li>
                </ul>
                <form class="d-flex ms-lg-3" role="search">
                    <input class="form-control me-2" type="search" placeholder="Город..." aria-label="Поиск">
                    <button class="btn btn-warning" type="submit">Найти</button>
                </form>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">Начинаем вёрстку сайта</h1>
            <p class="lead">Сожмите окно браузера — меню превратится в бургер.</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
