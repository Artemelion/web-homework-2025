<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event. Галерея</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f4f4f7;
        }

        .frame {
            width: 360px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
        }

        .frame img {
            max-width: 90%;
            max-height: 90%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #5b5bd6;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }

        .controls button:hover {
            background: #4343b8;
        }

        .counter {
            min-width: 50px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="frame">
        <img src="images/1.gif" name="picture" alt="Картинка галереи">
    </div>

    <div class="controls">
        <button id="prevButton">&lt;-- Prev</button>
        <span class="counter" id="counter"></span>
        <button id="nextButton">Next --&gt;</button>
    </div>

    <script>
        const locations = ["images/1.gif", "images/2.gif", "images/3.gif", "images/4.gif", "images/5.gif"];
        let currentImage = 0;

        const picture = document.images["picture"];
        const counter = document.querySelector("#counter");

        function showImage() {
            picture.src = locations[currentImage];
            counter.textContent = (currentImage + 1) + " / " + locations.length;
        }

        // следующая картинка
        function nextImage() {
            currentImage++;
            if (currentImage == locations.length) currentImage = 0;
            showImage();
        }

        // предыдущая картинка
        function prevImage() {
            currentImage--;
            if (currentImage < 0) currentImage = locations.length - 1;
            showImage();
        }

        // обработчики на кнопки
        document.querySelector("#nextButton").addEventListener("click", nextImage);
        document.querySelector("#prevButton").addEventListener("click", prevImage);

        showImage();
    </script>
</body>

</html>
