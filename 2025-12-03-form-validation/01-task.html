<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 01</title>
    <style>
        .form-group {
            margin: 4px;
        }

        .form-group label {
            width: 75px;
            display: inline-block;
        }

        .hint {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <form>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="login">
            <span class="hint" id="loginHint">Ваш логин должен состоять не менее чем из 4 символов</span>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password">
            <span class="hint" id="passwordHint">Пароль должен содержать буквы, цифры и специальный символ</span>
        </div>

        <div class="form-group">
            <input type="submit" value="Зарегистрироваться">
        </div>
    </form>
    <script>
        const form = document.forms[0];
        const loginHint = document.querySelector("#loginHint");
        const passwordHint = document.querySelector("#passwordHint");

        // подсказки показываем только при фокусе
        loginHint.hidden = true;
        passwordHint.hidden = true;

        form.login.addEventListener("focus", () => loginHint.hidden = false);
        form.login.addEventListener("blur", () => loginHint.hidden = true);
        form.password.addEventListener("focus", () => passwordHint.hidden = false);
        form.password.addEventListener("blur", () => passwordHint.hidden = true);

        // при отправке выводим логин и пароль
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Логин: " + form.login.value + "\nПароль: " + form.password.value);
        });
    </script>
</body>

</html>
