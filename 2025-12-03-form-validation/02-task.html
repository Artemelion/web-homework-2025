<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
    <style>
        .form-group {
            margin: 4px;
        }

        .form-group label {
            width: 75px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <form>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="login" required minlength="4"
                title="Не менее 4 символов">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{6,}"
                title="Минимум 6 символов: строчная и заглавная буква, цифра и спецсимвол (!@#$%^&*)">
        </div>

        <div class="form-group">
            <input type="submit" value="Зарегистрироваться">
        </div>
    </form>
    
    <script>
        // проверка через required, minlength и pattern
        document.forms[0].addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Форма прошла валидацию!");
        });
    </script>
</body>

</html>
