<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 03</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 10px;
        }

        #photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .photo {
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            font-size: 12px;
        }

        .photo img {
            display: block;
            width: 100%;
        }

        .photo p {
            margin: 5px;
        }
    </style>
</head>

<body>
    <h1>Фото</h1>
    <p id="status">Загрузка...</p>
    <div id="photos"></div>

    <script>
        const photosBox = document.querySelector("#photos");
        const status = document.querySelector("#status");

        // при загрузке страницы делаем GET запрос (берём первые 20 фото)
        window.addEventListener("load", function () {
            fetch("https://jsonplaceholder.typicode.com/photos?_limit=20")
                .then(response => response.json())
                .then(photos => {
                    for (const photo of photos) {
                        const div = document.createElement("div");
                        div.className = "photo";

                        const img = document.createElement("img");
                        img.src = photo.thumbnailUrl;
                        img.alt = photo.title;

                        const p = document.createElement("p");
                        p.textContent = photo.title;

                        div.append(img, p);
                        photosBox.append(div);
                    }
                    status.textContent = "";
                })
                .catch(() => status.textContent = "Ошибка загрузки");
        });
    </script>
</body>

</html>
