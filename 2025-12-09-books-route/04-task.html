<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 04</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 20px auto;
            padding: 0 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        .done {
            color: green;
        }

        .not-done {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Список задач</h1>
    <p id="status">Загрузка...</p>

    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Задача</th>
                <th>Выполнено</th>
            </tr>
        </thead>
        <tbody id="todos"></tbody>
    </table>

    <script>
        const tbody = document.querySelector("#todos");
        const status = document.querySelector("#status");

        // GET запрос, ответ выводим в таблицу (первые 20 задач)
        fetch("https://jsonplaceholder.typicode.com/todos?_limit=20")
            .then(response => response.json())
            .then(todos => {
                for (const todo of todos) {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${todo.id}</td>
                        <td>${todo.title}</td>
                        <td class="${todo.completed ? "done" : "not-done"}">${todo.completed ? "да" : "нет"}</td>`;
                    tbody.append(tr);
                }
                status.textContent = "";
            })
            .catch(() => status.textContent = "Ошибка загрузки");
    </script>
</body>

</html>
